    <aside>
      <h3>Ejemplo de Formulario</h3>
      <h2>REGISTRO DE CLIENTE</h2>
      <form action="#" class="form-group">
        <label for="nombre">Nombre: </label>
        <input class="form-control" type="text" id="nombre" />
        <br />
        <label for="apellido">Apellido: </label>
        <input class="form-control" type="text" id="apellido" />
        <br />
        <label for="correo">Correo:</label>
        <input class="form-control" type="email" id="correo" /><br />
        <label for="telefono">Telefono:</label>
        <input class="form-control" type="tel" id="telefono" /><br />
        <label for="edad">Edad:</label>
        <input class="form-control" type="number" id="edad" /><br />
        <label for="ciudad">Ciudad:</label>
        <select class="form-control" name="ciudad" id="ciudad">
          <option value="puno">Puno</option>
          <option value="juliaca">Juliaca</option>
          <option value="ilave">Ilave</option>
          <option value="juli">Juli</option>
          <option value="yunguyo">Yunguyo</option>
          <option value="lampa">Lampa</option>
          <option value="azangaro">Azangaro</option></select
        ><br />
        <label for="tipo">Tipo:</label>
        <input
          class="form-check-input"
          type="radio"
          name="tipo"
          value="cliente"
        />
        Cliente
        <input
          class="form-check-input"
          type="radio"
          name="tipo"
          value="empresa"
        />Empresa
        <br />
        <input type="checkbox" name="terminos" /><label for="terminos"
          >Acepto los Terminos</label
        ><br />
        <button class="btn btn-primary" type="submit">Aceptar</button>
        <button class="btn btn-danger" type="reset">Limpiar</button>
        <br />
        <p>Mensaje de Resultado</p>
      </form>
