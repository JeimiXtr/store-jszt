<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Online</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Catálogo Digital</h1>
    <button id="cart-btn" class="btn">Carrito (<span id="cart-count">0</span>)</button>
  </header>

  <main class="container">
    <section id="catalog" class="grid"></section>
  </main>

  <aside id="cart-panel" class="cart-panel hidden">
    <h2>Tu pedido</h2>
    <ul id="cart-items"></ul>
    <p class="total">Total: <strong id="cart-total">S/ 0.00</strong></p>
    <button id="checkout-whatsapp" class="btn primary">Pedir por WhatsApp</button>
    <button id="close-cart" class="btn">Cerrar</button>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
