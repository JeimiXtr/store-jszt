<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Online con Pedido a WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- HEADER -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="filterCategory('all')">
        <div class="bg-brand-600 text-white p-2 rounded-xl">
          <i class="fa-solid fa-store text-xl"></i>
        </div>
        <span class="text-xl font-bold bg-gradient-to-r from-brand-700 to-green-500 bg-clip-text text-transparent">
          Mi Tienda
        </span>
      </div>

      <!-- Carrito Trigger -->
      <button onclick="toggleCart()" class="relative p-2.5 bg-gray-100 hover:bg-brand-50 text-gray-700 hover:text-brand-600 rounded-xl transition-colors">
        <i class="fa-solid fa-bag-shopping text-xl"></i>
        <span id="cart-badge" class="absolute -top-1 -right-1 bg-brand-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center opacity-0 transition-opacity">
          0
        </span>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
    
    <!-- Filtros y Búsqueda -->
    <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-8">
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="search-input" oninput="renderProducts()" placeholder="Buscar productos..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 shadow-sm text-sm">
      </div>

      <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none" id="categories-container">
        <!-- Generado dinámicamente -->
      </div>
    </div>

    <!-- Grid de Productos -->
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Generado por JS -->
    </div>

  </main>

  <!-- DRAWER DEL CARRITO -->
  <div id="cart-backdrop" onclick="toggleCart()" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <div id="cart-drawer" class="fixed right-0 top-0 bottom-0 w-full max-w-md bg-white z-50 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b flex justify-between items-center">
      <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
        <i class="fa-solid fa-cart-shopping text-brand-600"></i> Tu Pedido
      </h2>
      <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 p-2">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <!-- Lista de items del carrito -->
    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4">
      <!-- Generado dinámicamente -->
    </div>

    <!-- Pie del carrito -->
    <div class="p-4 border-t bg-gray-50 space-y-4">
      <div class="flex justify-between text-base font-bold text-gray-900">
        <span>Total estimado:</span>
        <span id="cart-total">$0.00</span>
      </div>

      <button id="checkout-btn" onclick="openNameModal()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
        <i class="fa-brands fa-whatsapp text-xl"></i>
        <span>Enviar Pedido</span>
      </button>
    </div>
  </div>

  <!-- MODAL SOLO PARA INGRESAR NOMBRE -->
  <div id="name-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 transform scale-95 transition-transform duration-200" id="name-modal-card">
      
      <div class="text-center">
        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3">
          <i class="fa-solid fa-user-check text-xl"></i>
        </div>
        <h3 class="text-lg font-bold text-gray-900">Confirmar Nombre</h3>
        <p class="text-xs text-gray-500 mt-1">Ingresa tu nombre para adjuntarlo al mensaje de WhatsApp.</p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Tu Nombre</label>
        <input type="text" id="customer-name" placeholder="Ej. Maria Lopez" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeNameModal()" class="flex-1 py-3 text-gray-600 font-semibold hover:bg-gray-100 rounded-xl transition-colors text-sm">
          Cancelar
        </button>
        <button onclick="submitToWhatsApp()" class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2 transition-colors text-sm">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          Enviar
        </button>
      </div>

    </div>
  </div>

  <script>
    // CONFIGURACIÓN: Reemplaza con tu número de WhatsApp
    const PHONE_NUMBER = "51987654321"; // Formato internacional sin '+'

    const PRODUCTS = [
      { id: 1, name: "Zapatillas Deportivas", category: "Calzado", price: 49.99, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" },
      { id: 2, name: "Camiseta de Algodón", category: "Ropa", price: 19.99, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" },
      { id: 3, name: "Reloj Inteligente", category: "Accesorios", price: 89.99, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
      { id: 4, name: "Mochila Urbana", category: "Accesorios", price: 34.50, image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500" },
      { id: 5, name: "Gafas de Sol", category: "Accesorios", price: 25.00, image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500" },
      { id: 6, name: "Audífonos Bluetooth", category: "Tecnología", price: 59.99, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" }
    ];

    let cart = [];
    let selectedCategory = 'all';

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
      renderCategories();
      renderProducts();
    });

    function renderCategories() {
      const categories = ['all', ...new Set(PRODUCTS.map(p => p.category))];
      const container = document.getElementById('categories-container');
      
      container.innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')" 
          class="px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all ${selectedCategory === cat ? 'bg-brand-600 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'}">
          ${cat === 'all' ? 'Todos' : cat}
        </button>
      `).join('');
    }

    function filterCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const grid = document.getElementById('products-grid');

      const filtered = PRODUCTS.filter(p => {
        const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;
        const matchesQuery = p.name.toLowerCase().includes(query);
        return matchesCategory && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            <i class="fa-solid fa-box-open text-4xl mb-2"></i>
            <p>No se encontraron productos.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(product => `
        <div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition-shadow flex flex-col">
          <div class="h-48 overflow-hidden bg-gray-100 relative">
            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
            <span class="absolute top-2 right-2 bg-white/90 backdrop-blur-sm text-gray-700 text-xs px-2.5 py-1 rounded-full font-medium">
              ${product.category}
            </span>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-gray-800 text-base mb-1">${product.name}</h3>
              <p class="text-brand-700 font-extrabold text-lg">$${product.price.toFixed(2)}</p>
            </div>
            <button onclick="addToCart(${product.id})" class="mt-4 w-full bg-brand-50 hover:bg-brand-600 text-brand-700 hover:text-white font-semibold py-2.5 px-4 rounded-xl transition-colors flex items-center justify-center gap-2">
              <i class="fa-solid fa-plus text-sm"></i> Agregar
            </button>
          </div>
        </div>
      `).join('');
    }

    // GESTIÓN DEL CARRITO
    function addToCart(productId) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.qty++;
      } else {
        const product = PRODUCTS.find(p => p.id === productId);
        cart.push({ ...product, qty: 1 });
      }
      updateCart();
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      updateCart();
    }

    function updateCart() {
      const cartItemsContainer = document.getElementById('cart-items');
      const badge = document.getElementById('cart-badge');
      const totalElement = document.getElementById('cart-total');

      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      badge.textContent = totalCount;
      badge.style.opacity = totalCount > 0 ? '1' : '0';

      totalElement.textContent = `$${totalPrice.toFixed(2)}`;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `
          <div class="text-center py-12 text-gray-400">
            <i class="fa-solid fa-cart-flatbed text-4xl mb-2"></i>
            <p>El carrito está vacío</p>
          </div>
        `;
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl border border-gray-100">
          <img src="${item.image}" class="w-14 h-14 object-cover rounded-lg">
          <div class="flex-1 min-w-0">
            <h4 class="font-medium text-gray-800 text-sm truncate">${item.name}</h4>
            <p class="text-xs text-brand-700 font-bold">$${(item.price * item.qty).toFixed(2)}</p>
          </div>
          <div class="flex items-center gap-2 bg-white rounded-lg border px-2 py-1">
            <button onclick="updateQty(${item.id}, -1)" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-minus text-xs"></i></button>
            <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
            <button onclick="updateQty(${item.id}, 1)" class="text-gray-500 hover:text-green-500"><i class="fa-solid fa-plus text-xs"></i></button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart() {
      const drawer = document.getElementById('cart-drawer');
      const backdrop = document.getElementById('cart-backdrop');
      
      const isOpen = !drawer.classList.contains('translate-x-full');
      
      if (isOpen) {
        drawer.classList.add('translate-x-full');
        backdrop.classList.add('opacity-0', 'pointer-events-none');
      } else {
        drawer.classList.remove('translate-x-full');
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
      }
    }

    // MODAL NOMBRE Y WHATSAPP
    function openNameModal() {
      if (cart.length === 0) {
        alert("Agrega al menos un producto al carrito antes de enviar.");
        return;
      }

      const modal = document.getElementById('name-modal');
      const card = document.getElementById('name-modal-card');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.remove('scale-95');
      card.classList.add('scale-100');
    }

    function closeNameModal() {
      const modal = document.getElementById('name-modal');
      const card = document.getElementById('name-modal-card');
      card.classList.remove('scale-100');
      card.classList.add('scale-95');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    function submitToWhatsApp() {
      const nameInput = document.getElementById('customer-name').value.trim();
      const customerName = nameInput || "Cliente";

      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      let text = `🛒 *NUEVO PEDIDO*\n`;
      text += `👤 *Cliente:* ${customerName}\n\n`;
      text += `📋 *Detalle del Pedido:*\n`;

      cart.forEach((item, index) => {
        text += `${index + 1}. ${item.name} x${item.qty} - $${(item.price * item.qty).toFixed(2)}\n`;
      });

      text += `\n💰 *Total:* $${total.toFixed(2)}`;

      const url = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');

      closeNameModal();
      toggleCart();
    }
  </script>
</body>
</html>
